[package]
name = "surmap"
version = "0.1.0"
authors = ["Conrad Ludgate <conradludgate@gmail.com>"]
description = "Surjective and bijective hash maps with efficient lookups in both directions"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
readme = "README.md"
repository = "https://github.com/conradludgate/surmap"
documentation = "https://docs.rs/surmap"
keywords = ["map", "hashmap", "bimap", "surjective", "bidirectional"]
categories = ["data-structures"]

[dependencies]
hashbrown = "0.17.1"
serde_core = { version = "1.0", optional = true }

[features]
default = []
serde = ["dep:serde_core"]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
serde_json = "1.0"
bimap = "0.6.3"
multi_bimap = "0.8.0"
foldhash = "0.2.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "maps"
harness = false

[[bench]]
name = "strings"
harness = false
